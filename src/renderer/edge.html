<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, rgba(119,105,238,.72), rgba(94,76,255,.94));
        cursor: pointer;
        transition: filter .12s;
      }
      body:hover { filter: brightness(1.24); }
      .dots { display: flex; flex-direction: column; gap: 5px; }
      i { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.92); }
    </style>
  </head>
  <body title="展开 Sidepad">
    <div class="dots"><i></i><i></i><i></i></div>
    <script>
      let timer;
      document.body.addEventListener('mouseenter', () => {
        timer = setTimeout(() => window.sidepad.enter(), 140);
      });
      document.body.addEventListener('mouseleave', () => {
        clearTimeout(timer);
        window.sidepad.leave();
      });
    </script>
  </body>
</html>
